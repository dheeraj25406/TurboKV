[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turbokv"
version = "0.1.0"
description = "Memory-Adaptive KV Cache Optimization for LLM Inference on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "TurboKV Systems Research Team"}
]
dependencies = [
    "mlx>=0.20.0",
    "mlx-lm>=0.20.0",
    "psutil>=5.9.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.8.0",
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
include = ["turbokv*"]
